<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Marketrading | PayPal Deposit</title>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #1e2a3d;
            color: #ffffff;
            min-height: 100vh;
        }

        .paypal-container {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            padding: 45px 25px 60px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            color: #ffffff;
            text-decoration: none;

            font-size: 17px;
            font-weight: 700;

            margin-bottom: 45px;
        }

        .back-button:hover {
            opacity: 0.75;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .paypal-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .paypal-logo i {
            font-size: 70px;
            color: #ffd21c;
        }

        .page-header h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #aeb9ce;
            font-size: 18px;
        }

        .payment-card {
            background: #0f172a;
            border-radius: 24px;
            padding: 35px 30px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;

            font-size: 19px;
            font-weight: 700;

            margin-bottom: 11px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 62px;

            padding: 0 18px;

            border: none;
            border-radius: 15px;

            background: #34445b;
            color: #ffffff;

            font-size: 18px;
            outline: none;
        }

        .form-group input::placeholder {
            color: #aeb7c6;
        }

        .form-group input:focus,
        .form-group select:focus {
            box-shadow: 0 0 0 2px #ffd21c;
        }

        /* CONTINUE BUTTON */

        .continue-button {
            width: 100%;
            height: 62px;

            margin-top: 5px;

            border: none;
            border-radius: 15px;

            background: #fbbf24;
            color: #07111f;

            font-size: 18px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .continue-button:hover {
            background: #facc15;
            transform: translateY(-2px);
        }

        .continue-button:active {
            transform: scale(0.98);
        }

        /* PAYPAL AREA HIDDEN UNTIL CONTINUE */

        .paypal-section {
            display: none;
            margin-top: 30px;
        }

        .paypal-section h3 {
            text-align: center;

            font-size: 21px;
            font-weight: 700;

            margin-bottom: 20px;
        }

        #paypal-button-container {
            width: 100%;
            min-height: 45px;
        }

        #paymentMessage {
            display: none;

            margin-top: 20px;
            padding: 14px 16px;

            border-radius: 12px;

            text-align: center;

            font-size: 15px;
            line-height: 1.5;
        }

        .security-note {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            color: #8f9bb0;

            font-size: 14px;

            margin-top: 25px;
        }

        .security-note i {
            color: #ffd21c;
        }

        .paypal-loading {
            display: none;

            text-align: center;

            color: #aeb9ce;

            font-size: 14px;

            margin-top: 15px;
        }

        @media (max-width: 600px) {

            .paypal-container {
                padding: 25px 15px 45px;
            }

            .back-button {
                margin-bottom: 35px;
                font-size: 16px;
            }

            .paypal-logo i {
                font-size: 58px;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .page-header p {
                font-size: 16px;
            }

            .payment-card {
                padding: 28px 18px;
                border-radius: 20px;
            }

            .form-group label {
                font-size: 18px;
            }

            .form-group input,
            .form-group select {
                height: 58px;
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>


<script
    src="https://www.paypal.com/sdk/js?components=buttons&currency=USD"
    defer
></script>


<div class="paypal-container">


    <a
        href="deposit.html"
        class="back-button"
    >

        <i class="fa-solid fa-arrow-left"></i>

        Back to Deposit

    </a>


    <div class="page-header">

        <div class="paypal-logo">

            <i class="fa-brands fa-paypal"></i>

        </div>

        <h1>
            PayPal Deposit
        </h1>

        <p>
            Add money securely using PayPal
        </p>

    </div>


    <div class="payment-card">


        <!-- AMOUNT -->

        <div class="form-group">

            <label for="depositAmount">
                Amount
            </label>

            <input
                type="number"
                id="depositAmount"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter amount"
                autocomplete="off"
            >

        </div>


        <!-- CURRENCY -->

        <div class="form-group">

            <label for="depositCurrency">
                Currency
            </label>

            <select id="depositCurrency">

                <option value="USD">
                    USD
                </option>

                <option value="EUR">
                    EUR
                </option>

            </select>

        </div>


        <!-- CONTINUE -->

        <button
            type="button"
            id="continuePaymentBtn"
            class="continue-button"
        >

            Continue

            <i class="fa-solid fa-arrow-right"></i>

        </button>


        <!-- PAYPAL -->

        <div
            class="paypal-section"
            id="paypalSection"
        >

            <h3>
                Complete Payment
            </h3>

            <div
                id="paypal-button-container"
            ></div>

            <div
                id="paypalLoading"
                class="paypal-loading"
            >

                <i class="fa-solid fa-spinner fa-spin"></i>

                Loading PayPal...

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="paymentMessage"
        ></div>


        <div class="security-note">

            <i class="fa-solid fa-lock"></i>

            <span>
                Secure payment powered by PayPal
            </span>

        </div>

    </div>

</div>


<script>

"use strict";


document.addEventListener(
    "DOMContentLoaded",
    function () {

        const amountInput =
            document.getElementById(
                "depositAmount"
            );

        const currencySelect =
            document.getElementById(
                "depositCurrency"
            );

        const continueButton =
            document.getElementById(
                "continuePaymentBtn"
            );

        const paypalSection =
            document.getElementById(
                "paypalSection"
            );

        const message =
            document.getElementById(
                "paymentMessage"
            );


        /*
         * Make the selected amount available
         * to the PayPal payment code.
         */

        window.getPayPalDepositAmount =
            function () {

                return Number(
                    amountInput.value || 0
                );

            };


        window.getPayPalDepositCurrency =
            function () {

                return currencySelect.value;

            };


        window.showPayPalMessage =
            function (
                text,
                success = false
            ) {

                message.style.display =
                    "block";

                message.textContent =
                    text;

                if (success) {

                    message.style.background =
                        "#163d2b";

                    message.style.color =
                        "#7ff0b0";

                } else {

                    message.style.background =
                        "#3d2020";

                    message.style.color =
                        "#ff9b9b";

                }

            };


        window.hidePayPalMessage =
            function () {

                message.style.display =
                    "none";

            };


        /*
         * CONTINUE BUTTON
         */

        continueButton.addEventListener(
            "click",
            function () {

                const amount =
                    Number(
                        amountInput.value
                    );


                if (
                    !amount ||
                    amount < 1
                ) {

                    window.showPayPalMessage(
                        "Please enter a valid amount."
                    );

                    amountInput.focus();

                    return;
                }


                window.hidePayPalMessage();


                /*
                 * Show PayPal only after
                 * Continue is clicked.
                 */

                paypalSection.style.display =
                    "block";


                continueButton.style.display =
                    "none";


                /*
                 * Scroll smoothly to
                 * the PayPal checkout.
                 */

                paypalSection.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }

        );

    }

);

</script>


</body>

</html>
